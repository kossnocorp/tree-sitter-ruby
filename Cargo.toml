[package]
name = "tree-sitter-ruby"
description = "Ruby grammar for tree-sitter"
version = "0.23.1"
authors = [
  "Max Brunsfeld <maxbrunsfeld@gmail.com>",
  "Amaan Qureshi <amaanq12@gmail.com>",
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "ruby"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-ruby"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["LICENSE", "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[workspace]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = { git = "https://github.com/kossnocorp/tree-sitter", branch = "wasm-malloc" }

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = { git = "https://github.com/kossnocorp/tree-sitter", branch = "wasm-malloc" }

# NOTE: Use these for local development with path overrides:

# [patch."https://github.com/kossnocorp/tree-sitter"]
# tree-sitter = { path = "../tree-sitter/lib" }
# tree-sitter-language = { path = "../tree-sitter/crates/language" }
